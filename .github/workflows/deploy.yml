# Publica el sitio en Cloudflare Pages en cada cambio a main.
# Necesita dos secretos en GitHub (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN  y  CLOUDFLARE_ACCOUNT_ID
# Si no están, el workflow se salta sin fallar.
name: Publicar en Cloudflare Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Revisar secretos
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Faltan los secretos de Cloudflare; no se publica." ; echo "ok=false" >> "$GITHUB_OUTPUT"
          else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.check.outputs.ok == 'true'
        run: npm ci && npm run build
      - name: Crear el proyecto si no existe
        if: steps.check.outputs.ok == 'true'
        run: npx --yes wrangler@3 pages project create celebra --production-branch main || true
      - name: Publicar
        if: steps.check.outputs.ok == 'true'
        run: npx --yes wrangler@3 pages deploy dist --project-name celebra --branch main
